name: test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # ponytail: temporary until gwatts/go-coverage-action stops declaring node20 runtime
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go coverage
        if: github.event_name == 'push'
        uses: gwatts/go-coverage-action@v2
        with:
          cover-mode: atomic
          cover-pkg: ./...
          test-pkgs: ./...

      - name: Go test coverage
        if: github.event_name == 'pull_request'
        run: go test -covermode atomic -coverpkg ./... ./...
